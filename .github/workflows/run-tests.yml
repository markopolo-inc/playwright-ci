name: Test Suite

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'pytest path/filter — e.g. tests/test_canary.py or -k login'
        required: false
        default: ''
      canary_only:
        description: 'Run canary only (fast ~5 min)'
        type: boolean
        default: false

concurrency:
  group: test-suite
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  run-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ── 1. Mask all secret values immediately ─────────────────────────────
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.REPO_SLUG }}"
          echo "::add-mask::${{ secrets.EMAIL_TEST_EMAIL }}"
          echo "::add-mask::${{ secrets.EMAIL_TEST_PASSWORD }}"
          echo "::add-mask::${{ secrets.WOO_TEST_EMAIL }}"
          echo "::add-mask::${{ secrets.WOO_TEST_PASSWORD }}"

      # ── 2. SSH agent → clone private repo → immediately remove key ────────
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Clone source
        run: |
          git clone --quiet --depth=1 "git@github.com:${{ secrets.REPO_SLUG }}.git" src
          echo "Clone complete"

      - name: Remove SSH key from agent
        if: always()
        run: ssh-add -D 2>/dev/null || true

      # ── 3. Python + dependencies ──────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install Python dependencies
        working-directory: src
        run: |
          pip install -q -r requirements.txt
          pip install -q pytest-json-report pytest-xdist pytest-html

      - name: Install Playwright browsers
        working-directory: src
        run: python -m playwright install chromium --with-deps

      # ── 4. Canary (fast gate — always runs first) ─────────────────────────
      - name: Canary smoke tests
        id: canary
        working-directory: src
        env:
          EMAIL_TEST_EMAIL: ${{ secrets.EMAIL_TEST_EMAIL }}
          EMAIL_TEST_PASSWORD: ${{ secrets.EMAIL_TEST_PASSWORD }}
          WOO_TEST_EMAIL: ${{ secrets.WOO_TEST_EMAIL }}
          WOO_TEST_PASSWORD: ${{ secrets.WOO_TEST_PASSWORD }}
          HEADLESS: 'true'
          BASE_URL: 'https://app-stg.markopolo.ai'
        run: |
          python -m pytest tests/test_canary.py -m smoke \
            --tb=short -q \
            --json-report --json-report-file=canary_report.json \
            -o "addopts=" \
            2>&1 | tail -30
        continue-on-error: true

      # ── 5. Full suite (only on 9 PM schedule or manual without canary_only) ─
      - name: Full test suite
        id: full_suite
        if: github.event.inputs.canary_only != 'true'
        working-directory: src
        env:
          EMAIL_TEST_EMAIL: ${{ secrets.EMAIL_TEST_EMAIL }}
          EMAIL_TEST_PASSWORD: ${{ secrets.EMAIL_TEST_PASSWORD }}
          WOO_TEST_EMAIL: ${{ secrets.WOO_TEST_EMAIL }}
          WOO_TEST_PASSWORD: ${{ secrets.WOO_TEST_PASSWORD }}
          HEADLESS: 'true'
          BASE_URL: 'https://app-stg.markopolo.ai'
        run: |
          FILTER="${{ github.event.inputs.filter }}"
          python -m pytest ${FILTER:-tests/} \
            --ignore=tests/advanced_types \
            --tb=short -q \
            -n auto \
            --json-report --json-report-file=full_report.json \
            --html=report.html --self-contained-html \
            -o "addopts=" \
            2>&1 | tail -60
        continue-on-error: true

      # ── 6. Convert reports → automation_status JSON ───────────────────────
      - name: Generate status JSON
        if: always()
        working-directory: src
        run: |
          python3 - <<'PYEOF'
          import json, os

          for report_file, out_file in [
              ("canary_report.json",  "automation_status_canary.json"),
              ("full_report.json",    "automation_status_stg.json"),
          ]:
              if not os.path.exists(report_file):
                  print(f"Skipped {report_file} — not found")
                  continue

              with open(report_file) as f:
                  report = json.load(f)

              summary = report.get("summary", {})
              status = {
                  "_run_at":  report.get("created", ""),
                  "_total":   summary.get("total", 0),
                  "_passed":  summary.get("passed", 0),
                  "_failed":  summary.get("failed", 0),
                  "_skipped": summary.get("skipped", 0),
              }

              for test in report.get("tests", []):
                  outcome = test.get("outcome", "")
                  node_id = test.get("nodeid", "")
                  if outcome == "passed":
                      status[node_id] = "Pass"
                  elif outcome in ("failed", "error"):
                      status[node_id] = "Fail"
                  elif outcome == "skipped":
                      status[node_id] = "Skip"

              with open(out_file, "w") as f:
                  json.dump(status, f, indent=2)

              total  = summary.get("total", 0)
              passed = summary.get("passed", 0)
              failed = summary.get("failed", 0)
              pct    = round(passed / total * 100, 1) if total else 0
              print(f"{out_file}: {passed}/{total} passed ({pct}%), {failed} failed")
          PYEOF

      # ── 7. Copy ONLY results files to a clean publish dir ─────────────────
      #    NEVER publish src/ — it contains the private repo clone
      # Only copy status JSONs — never report.html (it may contain account details in failure msgs)
      - name: Prepare results for publish
        if: always()
        run: |
          mkdir -p publish
          for f in \
            src/automation_status_stg.json \
            src/automation_status_canary.json; do
            [ -f "$f" ] && cp "$f" publish/ && echo "Included: $f" || echo "Missing: $f"
          done

      # ── 8. Publish ONLY results dir to gh-pages (not the private repo clone)─
      - name: Publish results to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          publish_branch: gh-pages
          keep_files: true
          commit_message: "ci: update results [run #${{ github.run_number }}]"

      # ── 9. Upload artifacts ───────────────────────────────────────────────
      # Artifacts require GitHub login — safe to include detailed report.html here
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-run-${{ github.run_number }}
          path: |
            publish/
            src/report.html
          if-no-files-found: warn
          retention-days: 30

      # ── 10. Job summary ───────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os

          lines = ["## Test Results\n"]
          any_report = False

          for label, fname in [("Canary", "src/canary_report.json"), ("Full Suite", "src/full_report.json")]:
              if not os.path.exists(fname):
                  continue
              any_report = True
              with open(fname) as f:
                  r = json.load(f)
              s = r.get("summary", {})
              total   = s.get("total",   0)
              passed  = s.get("passed",  0)
              failed  = s.get("failed",  0)
              skipped = s.get("skipped", 0)
              pct     = round(passed / total * 100, 1) if total else 0
              icon    = "✅" if failed == 0 else "❌"
              lines.append(f"### {icon} {label}")
              lines.append(f"| Metric | Count |")
              lines.append(f"|--------|-------|")
              lines.append(f"| Total  | {total} |")
              lines.append(f"| Pass   | {passed} ({pct}%) |")
              lines.append(f"| Fail   | {failed} |")
              lines.append(f"| Skip   | {skipped} |")
              lines.append("")

          if not any_report:
              lines.append("_No test reports generated — check earlier steps for errors._")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary_path, "a") as f:
              f.write("\n".join(lines))
          PYEOF
