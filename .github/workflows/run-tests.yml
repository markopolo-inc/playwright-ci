name: Test Suite

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'pytest path/filter — e.g. tests/test_canary.py or -k login'
        required: false
        default: ''
      canary_only:
        description: 'Run canary only (fast ~5 min)'
        type: boolean
        default: false

concurrency:
  group: test-suite-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  run-tests:
    name: ${{ matrix.env == 'stg' && '🟡 STG' || '🟢 MAIN' }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      matrix:
        env: [stg, main]
      fail-fast: false   # both envs run to completion even if one fails

    steps:
      # ── 1. Mask all secret values immediately ─────────────────────────────
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.REPO_SLUG }}"
          echo "::add-mask::${{ secrets.EMAIL_TEST_EMAIL }}"
          echo "::add-mask::${{ secrets.EMAIL_TEST_PASSWORD }}"
          echo "::add-mask::${{ secrets.WOO_TEST_EMAIL }}"
          echo "::add-mask::${{ secrets.WOO_TEST_PASSWORD }}"

      # ── 2. SSH agent → clone private repo → immediately remove key ────────
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Clone source
        run: |
          git clone --quiet --depth=1 "git@github.com:${{ secrets.REPO_SLUG }}.git" src
          echo "Clone complete"

      - name: Remove SSH key from agent
        if: always()
        run: ssh-add -D 2>/dev/null || true

      # ── 3. Python + dependencies ──────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install Python dependencies
        working-directory: src
        run: |
          pip install -q -r requirements.txt
          pip install -q pytest-json-report pytest-xdist pytest-html

      - name: Install Playwright browsers
        working-directory: src
        run: python -m playwright install chromium --with-deps

      # ── 4. Canary (fast gate) ─────────────────────────────────────────────
      - name: Canary smoke tests
        id: canary
        working-directory: src
        env:
          EMAIL_TEST_EMAIL: ${{ secrets.EMAIL_TEST_EMAIL }}
          EMAIL_TEST_PASSWORD: ${{ secrets.EMAIL_TEST_PASSWORD }}
          WOO_TEST_EMAIL: ${{ secrets.WOO_TEST_EMAIL }}
          WOO_TEST_PASSWORD: ${{ secrets.WOO_TEST_PASSWORD }}
          HEADLESS: 'true'
          BASE_URL: ${{ matrix.env == 'stg' && 'https://app-stg.markopolo.ai' || 'https://app.markopolo.ai' }}
          MARKOPOLO_URL: ${{ matrix.env == 'stg' && 'https://app-stg.markopolo.ai' || 'https://app.markopolo.ai' }}
        run: |
          python -m pytest tests/test_canary.py -m smoke \
            --tb=short -q \
            --json-report --json-report-file=canary_report.json \
            -o "addopts=" \
            2>&1 | tail -30
        continue-on-error: true

      # ── 5. Full suite ──────────────────────────────────────────────────────
      - name: Full test suite
        id: full_suite
        if: github.event.inputs.canary_only != 'true'
        working-directory: src
        env:
          EMAIL_TEST_EMAIL: ${{ secrets.EMAIL_TEST_EMAIL }}
          EMAIL_TEST_PASSWORD: ${{ secrets.EMAIL_TEST_PASSWORD }}
          WOO_TEST_EMAIL: ${{ secrets.WOO_TEST_EMAIL }}
          WOO_TEST_PASSWORD: ${{ secrets.WOO_TEST_PASSWORD }}
          HEADLESS: 'true'
          BASE_URL: ${{ matrix.env == 'stg' && 'https://app-stg.markopolo.ai' || 'https://app.markopolo.ai' }}
          MARKOPOLO_URL: ${{ matrix.env == 'stg' && 'https://app-stg.markopolo.ai' || 'https://app.markopolo.ai' }}
        run: |
          FILTER="${{ github.event.inputs.filter }}"
          python -m pytest ${FILTER:-tests/} \
            --ignore=tests/advanced_types \
            --tb=short -q \
            -n auto \
            --json-report --json-report-file=full_report.json \
            --html=report.html --self-contained-html \
            -o "addopts=" \
            2>&1 | tail -60
        continue-on-error: true

      # ── 6. Convert reports → automation_status JSON + report.json ─────────
      - name: Generate status JSON
        if: always()
        working-directory: src
        env:
          RUN_ENV: ${{ matrix.env }}
        run: |
          python3 - <<'PYEOF'
          import json, os, shutil

          run_env = os.environ.get("RUN_ENV", "stg")

          def convert_report(report_file, out_file):
              if not os.path.exists(report_file):
                  print(f"Skipped {report_file} — not found")
                  return {}

              with open(report_file) as f:
                  report = json.load(f)

              summary = report.get("summary", {})
              status = {
                  "_run_at":  report.get("created", ""),
                  "_total":   summary.get("total", 0),
                  "_passed":  summary.get("passed", 0),
                  "_failed":  summary.get("failed", 0),
                  "_skipped": summary.get("skipped", 0),
              }

              for test in report.get("tests", []):
                  outcome = test.get("outcome", "")
                  node_id = test.get("nodeid", "")
                  if outcome == "passed":
                      status[node_id] = "Pass"
                  elif outcome in ("failed", "error"):
                      status[node_id] = "Fail"
                  elif outcome == "skipped":
                      status[node_id] = "Skip"

              with open(out_file, "w") as f:
                  json.dump(status, f, indent=2)

              total  = summary.get("total", 0)
              passed = summary.get("passed", 0)
              failed = summary.get("failed", 0)
              pct    = round(passed / total * 100, 1) if total else 0
              print(f"{out_file}: {passed}/{total} passed ({pct}%), {failed} failed")
              return status

          # Canary results
          canary_status = convert_report(
              "canary_report.json",
              f"automation_status_canary_{run_env}.json",
          )

          # Full suite results — may not exist if suite timed out
          full_status = convert_report(
              "full_report.json",
              f"automation_status_{run_env}.json",
          )

          # Fallback: if full suite didn't produce results, publish canary results
          # as automation_status_{env}.json so the dashboard isn't empty
          if not os.path.exists(f"automation_status_{run_env}.json") and canary_status:
              with open(f"automation_status_{run_env}.json", "w") as f:
                  json.dump(canary_status, f, indent=2)
              print(f"Fallback: wrote canary results → automation_status_{run_env}.json")

          # Also copy full_report.json → {env}/report.json for the report page
          if os.path.exists("full_report.json"):
              os.makedirs(run_env, exist_ok=True)
              shutil.copy("full_report.json", f"{run_env}/report.json")
              print(f"Copied full_report.json → {run_env}/report.json")

          # Backward compat: stg canary → automation_status_canary.json
          if run_env == "stg" and os.path.exists("automation_status_canary_stg.json"):
              shutil.copy("automation_status_canary_stg.json", "automation_status_canary.json")
              print("Copied canary stg → automation_status_canary.json (backward compat)")
          PYEOF

      # ── 7. Prepare publish dir (only results — NEVER src/) ────────────────
      - name: Prepare results for publish
        if: always()
        env:
          RUN_ENV: ${{ matrix.env }}
        run: |
          mkdir -p publish/${RUN_ENV}
          # Root-level status JSONs (fetched by testcases.html)
          for f in \
            src/automation_status_${RUN_ENV}.json \
            src/automation_status_canary_${RUN_ENV}.json \
            src/automation_status_canary.json; do
            [ -f "$f" ] && cp "$f" publish/ && echo "Included: $f" || true
          done
          # Per-env report.json (fetched by stg/index.html or main/index.html)
          [ -f "src/${RUN_ENV}/report.json" ] && cp "src/${RUN_ENV}/report.json" "publish/${RUN_ENV}/report.json" && echo "Included: ${RUN_ENV}/report.json" || echo "Missing: ${RUN_ENV}/report.json"
          echo "Publish dir contents:"
          find publish/ -type f | sort

      # ── 8. Publish results to gh-pages (with push retry for race condition) ─
      - name: Publish results to gh-pages
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH="gh-pages"
          WORK_DIR="$(pwd)/publish"
          DEPLOY_DIR="$(pwd)/_ghpages_deploy"

          # Clone or init gh-pages branch
          if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" > /dev/null 2>&1; then
            git clone --depth=1 --branch="$BRANCH" "$REMOTE" "$DEPLOY_DIR"
          else
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git init && git checkout -b "$BRANCH"
            git remote add origin "$REMOTE"
            cd -
          fi

          # Merge new files in (keep existing — other matrix job's files)
          cp -r "$WORK_DIR"/. "$DEPLOY_DIR"/

          cd "$DEPLOY_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy — skipping push"
            exit 0
          fi
          git commit -m "ci: update ${{ matrix.env }} results [run #${{ github.run_number }}]"

          # Retry push up to 5 times — handles race condition when MAIN and STG
          # push simultaneously. Pull --rebase syncs with the winning push, then
          # we push our unique env files on top.
          for i in 1 2 3 4 5; do
            if git push origin "$BRANCH"; then
              echo "Push succeeded on attempt $i"
              break
            else
              echo "Push attempt $i failed (likely race with other env job) — pulling and retrying..."
              git pull --rebase origin "$BRANCH" 2>/dev/null || true
              sleep $((i * 3))
            fi
          done

      # ── 9. Upload artifacts ───────────────────────────────────────────────
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.env }}-run-${{ github.run_number }}
          path: |
            publish/
            src/report.html
          if-no-files-found: warn
          retention-days: 30

      # ── 10. Job summary ───────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        env:
          RUN_ENV: ${{ matrix.env }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          run_env = os.environ.get("RUN_ENV", "stg")
          env_label = "STG" if run_env == "stg" else "MAIN"
          lines = [f"## Test Results — {env_label}\n"]

          for label, fname in [("Canary", "src/canary_report.json"), ("Full Suite", "src/full_report.json")]:
              if not os.path.exists(fname):
                  continue
              with open(fname) as f:
                  r = json.load(f)
              s = r.get("summary", {})
              total   = s.get("total",   0)
              passed  = s.get("passed",  0)
              failed  = s.get("failed",  0)
              skipped = s.get("skipped", 0)
              pct     = round(passed / total * 100, 1) if total else 0
              icon    = "✅" if failed == 0 else "❌"
              lines.append(f"### {icon} {label}")
              lines.append(f"| Metric | Count |")
              lines.append(f"|--------|-------|")
              lines.append(f"| Total  | {total} |")
              lines.append(f"| Pass   | {passed} ({pct}%) |")
              lines.append(f"| Fail   | {failed} |")
              lines.append(f"| Skip   | {skipped} |")
              lines.append("")

          if len(lines) == 1:
              lines.append("_No test reports generated — check earlier steps for errors._")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary_path, "a") as f:
              f.write("\n".join(lines))
          PYEOF
